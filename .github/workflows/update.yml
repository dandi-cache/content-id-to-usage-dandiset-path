name: Update

permissions:
  contents: read
  packages: read

on:
  schedule:
    - cron: "0 4 * * *"  # Run daily at 04:00 UTC, after the source cache has updated
  workflow_dispatch:
    inputs:
      testing:
        # A testing run processes only a few entries of each category and reads/writes
        # derivatives/testing.jsonl, so the real cache is never touched.
        description: "Testing mode: process only a few entries of each category and write to derivatives/testing.jsonl instead of the real cache."
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets._GITHUB_API_KEY }}

jobs:
  Update:
    permissions:
      actions: write
      contents: read
      packages: read
    runs-on: ubuntu-latest

    steps:
      - name: Check for running workflows
        env:
          GH_TOKEN: ${{ secrets._GITHUB_API_KEY }}
        run: |
          RUNNING_COUNT=$(gh run list --repo "${{ github.repository }}" --workflow "${{ github.workflow }}" --status in_progress --json databaseId | jq '. | length')

          if [ "$RUNNING_COUNT" -gt 1 ]; then
            echo "Another run is already in progress. Cancelling this run..."
            gh run cancel --repo "${{ github.repository }}" ${{ github.run_id }}
            # Sleep to allow cancellation to propagate
            sleep 60
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets._GITHUB_API_KEY }}
          submodules: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install git-annex
        run: |
          sudo apt-get update
          sudo apt-get install -y git-annex

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets._GITHUB_API_KEY }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Run update with provenance
        env:
          REPO_URL: https://x-access-token:${{ secrets._GITHUB_API_KEY }}@github.com/${{ github.repository }}.git
          WORKSPACE: ${{ github.workspace }}
          # Empty for scheduled runs and "false" for plain manual runs (complete update);
          # only "true" when testing mode is explicitly selected on workflow_dispatch.
          TESTING: ${{ github.event.inputs.testing }}
          GITHUB_SHA: ${{ github.sha }}
          IMAGE: ghcr.io/dandi-cache/content-id-to-usage-dandiset-path:latest
        run: bash code/update_pipeline.sh

  NotifyOnFailure:
    runs-on: ubuntu-latest
    needs: [ Update ]
    if: ${{ always() && failure() }}
    permissions: {}
    steps:
      - uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI Failure: DANDI Cache: content-id-to-usage-dandiset-path"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: DANDI Cache <dandi-cache@users.noreply.github.com>
          body: "Please check the latest run of the DANDI Cache update: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
