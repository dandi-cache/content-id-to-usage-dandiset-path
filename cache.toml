# The complete declarative description of this cache.
#
# One file, read by both the shared orchestration and this cache's own update code, so the two
# cannot disagree. It replaces what used to be spread across `code/update_pipeline.sh` (the input
# subdataset URL, path and branch, the output file name, the entry point), the update workflow
# (the image reference), `dataset_description.json`, and the constants at the top of
# `code/update.py`.

[cache]
name = "content-id-to-usage-dandiset-path"

# Two files, written together by every run:
#
#   content_id_to_usage_dandiset_path  the cache itself, one `{dandiset ID: path}` per content ID
#   content_id_to_resolved_from        the fingerprint of the upstream entry each heuristic answer
#                                      was resolved from, which is what makes reusing it safe
#
# The cache itself is split across sixteen files by the first digit of the content ID,
# `content_id_to_usage_dandiset_path_0.jsonl` to `content_id_to_usage_dandiset_path_f.jsonl`. As one
# file it grew to within a week of GitHub's 100 MiB limit, past which every push is refused.
#
# Declaring them here is what publishes all of them to `dist` and what keeps a `testing_` artifact
# from reaching consumers.
outputs = [
    "content_id_to_usage_dandiset_path_0.jsonl",
    "content_id_to_usage_dandiset_path_1.jsonl",
    "content_id_to_usage_dandiset_path_2.jsonl",
    "content_id_to_usage_dandiset_path_3.jsonl",
    "content_id_to_usage_dandiset_path_4.jsonl",
    "content_id_to_usage_dandiset_path_5.jsonl",
    "content_id_to_usage_dandiset_path_6.jsonl",
    "content_id_to_usage_dandiset_path_7.jsonl",
    "content_id_to_usage_dandiset_path_8.jsonl",
    "content_id_to_usage_dandiset_path_9.jsonl",
    "content_id_to_usage_dandiset_path_a.jsonl",
    "content_id_to_usage_dandiset_path_b.jsonl",
    "content_id_to_usage_dandiset_path_c.jsonl",
    "content_id_to_usage_dandiset_path_d.jsonl",
    "content_id_to_usage_dandiset_path_e.jsonl",
    "content_id_to_usage_dandiset_path_f.jsonl",
    "content_id_to_resolved_from.jsonl",
]

# Upstream cache, registered as a DataLad input subdataset and pinned in every run's provenance.
#
# `lookup` because the update code needs the whole mapping at once to split it into the
# already-unique entries and the two non-unique cases: each line is
# `{content_id: {dandiset_id: [paths]}}` and they are merged into one mapping.
[[inputs]]
name = "content-id-to-dandiset-paths"
format = "lookup"

# Most content IDs appear once, under one path, and reducing them is a passthrough with no work in
# it; the rest cost a Dandiset creation time from S3 and an asset creation time per candidate path
# from the DANDI API. This is how many of those a run resolves: the ceiling that keeps a growing
# archive from outgrowing the cron rather than a throttle on the current one.
#
# Nothing is lost while it converges. The first run under the accumulative model has no
# fingerprints recorded yet, so every ambiguous content ID looks stale, but their answers are
# already in the published file and are republished whether or not this run reconfirmed them.
#
# Sized from this cache's own update logs, slow items included: resampling 6,000 timed items puts a
# run of 20000 at about 100 minutes typically and 118 at the 99th percentile, inside the job's
# 330-minute timeout with margin. The margin matters, because a run that times out publishes nothing
# it did. 20000 clears the backlog of ambiguous content IDs in one run.
[operations.update]
limit = 20000
# Two ambiguous content IDs exercise both heuristics and every network call behind them, and the
# passthrough runs in full regardless, since it costs nothing.
testing_limit = 2

# The published branches describe this repository as a BIDS study dataset, through a
# `dataset_description.json` with `DatasetType: "study"`. The pipeline renders that file from this
# section at the start of every run, so the repository no longer carries it.
[description]
authors = ["Cody Baker"]
